<!DOCTYPE html>
<html lang="zh-TW" data-ui-theme="cyrene-night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyrene</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    #live2d-canvas {
      display: block;
      width: 100%; height: 100%;
    }
    #pet-reply {
      position: fixed;
      left: 22px;
      right: 22px;
      top: 18px;
      z-index: 20;
      padding: 12px 15px;
      border: 1px solid rgba(235, 202, 255, 0.28);
      border-radius: 18px 18px 18px 6px;
      background: rgba(27, 18, 39, 0.9);
      color: rgba(255, 249, 255, 0.96);
      box-shadow: 0 12px 32px rgba(11, 4, 18, 0.26);
      backdrop-filter: blur(16px);
      font: 500 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      user-select: text;
    }
    #pet-reply[hidden], #pet-chat-form[hidden] { display: none; }
    #pet-chat-form {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 7px 7px 14px;
      border: 1px solid rgba(235, 202, 255, 0.3);
      border-radius: 22px;
      background: rgba(25, 16, 37, 0.9);
      box-shadow: 0 12px 32px rgba(11, 4, 18, 0.3);
      backdrop-filter: blur(16px);
    }
    #pet-chat-input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: rgba(255, 250, 255, 0.97);
      font: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      user-select: text;
    }
    #pet-chat-input::placeholder { color: rgba(230, 211, 239, 0.66); }
    #pet-chat-submit {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      background: linear-gradient(145deg, #ff70ae, #a86ae8);
      color: white;
      font-size: 19px;
      cursor: pointer;
    }
    #pet-chat-submit:disabled { opacity: 0.55; cursor: wait; }
    #pet-chat-input:focus-visible, #pet-chat-submit:focus-visible {
      outline: 2px solid rgba(255, 193, 230, 0.9);
      outline-offset: 2px;
    }
  </style>
  <link rel="stylesheet" href="./ui/tokens.css" />
  <link rel="stylesheet" href="./ui/fonts.css" />
  <link rel="stylesheet" href="./ui/base.css" />
  <link rel="stylesheet" href="./ui/theme.css" />
  <!-- Cubism 4 Core (required by pixi-live2d-display/cubism4) -->
  <script src="/live2dcubismcore.min.js"></script>
</head>
<body>
  <canvas id="live2d-canvas"></canvas>
  <div id="pet-reply" role="status" aria-live="polite" hidden></div>
  <form id="pet-chat-form" aria-label="和昔漣快速對話" hidden>
    <input id="pet-chat-input" type="text" maxlength="500" autocomplete="off" placeholder="和昔漣說話…" aria-label="輸入訊息" />
    <button id="pet-chat-submit" type="submit" aria-label="送出訊息">↑</button>
  </form>
  <script type="module" src="./main.ts"></script>
</body>
</html>
