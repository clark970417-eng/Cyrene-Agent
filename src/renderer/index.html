<!DOCTYPE html>
<html lang="zh-TW" data-ui-theme="cyrene-night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyrene</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }
    #live2d-canvas {
      display: block;
      width: 100%; height: 100%;
      opacity: 0;
      transform: translateY(4px) scale(0.985);
      transition:
        opacity 360ms ease-out,
        transform 440ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.is-ready #live2d-canvas {
      opacity: 1;
      transform: none;
    }
    #pet-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 30;
      pointer-events: none;
      transition: opacity 220ms ease, transform 280ms ease;
    }
    body.is-ready #pet-loader {
      opacity: 0;
      transform: translateY(-4px) scale(0.94);
    }
    .pet-loader__butterfly {
      position: relative;
      width: 50px;
      height: 40px;
      filter: drop-shadow(0 5px 10px rgba(168, 85, 247, 0.24));
      animation: butterfly-float 1.35s ease-in-out infinite;
    }
    .pet-loader__butterfly::before,
    .pet-loader__butterfly::after {
      content: "";
      position: absolute;
      top: 4px;
      width: 22px;
      height: 29px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      background:
        radial-gradient(circle at 38% 28%, rgba(255, 255, 255, 0.92) 0 7%, transparent 8%),
        linear-gradient(145deg, rgba(255, 163, 211, 0.92), rgba(162, 132, 255, 0.88) 72%);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.42);
    }
    .pet-loader__butterfly::before {
      left: 3px;
      border-radius: 78% 32% 70% 28%;
      transform: rotate(-24deg);
      transform-origin: 100% 64%;
    }
    .pet-loader__butterfly::after {
      right: 3px;
      border-radius: 32% 78% 28% 70%;
      transform: rotate(24deg);
      transform-origin: 0 64%;
    }
    .pet-loader__spark {
      position: absolute;
      left: 50%;
      top: 9px;
      width: 3px;
      height: 25px;
      border-radius: 99px;
      transform: translateX(-50%);
      background: linear-gradient(#fff, #df6cac 72%);
      box-shadow: 0 0 9px rgba(255, 126, 198, 0.72);
      z-index: 1;
    }
    .pet-loader__label {
      position: absolute;
      top: calc(50% + 35px);
      padding: 5px 10px 6px;
      border: 1px solid rgba(255, 177, 220, 0.36);
      border-radius: 999px;
      color: #d958a0;
      background: rgba(255, 249, 253, 0.82);
      box-shadow: 0 6px 18px rgba(116, 70, 145, 0.12);
      font: 600 12px/1.2 system-ui, -apple-system, "PingFang TC", sans-serif;
      letter-spacing: 0.06em;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    body.is-load-error .pet-loader__butterfly {
      animation: none;
      opacity: 0.58;
    }
    body.is-load-error .pet-loader__label {
      color: #b42358;
    }
    @keyframes butterfly-float {
      0%, 100% { transform: translateY(1px) rotate(-1deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #live2d-canvas,
      #pet-loader { transition-duration: 1ms; }
      .pet-loader__butterfly { animation: none; }
    }
    /* Opener 主動開口氣泡 */
    #opener-bubble {
      position: absolute;
      bottom: 64%;
      left: 58%;
      transform: translateX(-50%);
      width: max-content;
      min-width: 220px;
      max-width: min(310px, calc(100vw - 24px));
      padding: 10px 16px;
      background: rgba(204, 188, 251, 0.96);
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: left;
      text-wrap: pretty;
      color: #df5da9;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: auto;
      cursor: pointer;
      z-index: 10;
    }
    #opener-bubble.opener-bubble--show { opacity: 1; }
    #opener-bubble::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: rgba(204, 188, 251, 0.96);
      border-bottom: 0;
    }
    #pet-chat-form {
      position: absolute;
      left: 50%;
      bottom: 54px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      width: min(244px, calc(100% - 48px));
      padding: 4px;
      border: 1px solid rgba(197, 125, 236, 0.48);
      border-radius: 18px;
      background: rgba(24, 14, 31, 0.88);
      box-shadow: 0 8px 28px rgba(20, 7, 27, 0.28);
      backdrop-filter: blur(12px);
      z-index: 20;
    }
    #pet-chat-form[hidden] { display: none; }
    #pet-chat-input {
      min-width: 0;
      flex: 1;
      height: 30px;
      padding: 0 8px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font: 13px/1.2 system-ui, sans-serif;
      user-select: text;
    }
    #pet-chat-input::placeholder { color: rgba(233, 216, 240, 0.62); }
    #pet-chat-submit {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      font-size: 17px;
      cursor: pointer;
    }
    #pet-chat-submit:disabled { opacity: 0.5; cursor: wait; }
  </style>
  <link rel="stylesheet" href="./ui/tokens.css" />
  <link rel="stylesheet" href="./ui/fonts.css" />
  <link rel="stylesheet" href="./ui/base.css" />
  <link rel="stylesheet" href="./ui/theme.css" />
  <!-- Cubism 4 Core (required by pixi-live2d-display/cubism4) -->
  <script src="/live2dcubismcore.min.js"></script>
</head>
<body class="is-booting">
  <div id="pet-loader" role="status" aria-live="polite">
    <div class="pet-loader__butterfly" aria-hidden="true"><span class="pet-loader__spark"></span></div>
    <span class="pet-loader__label">昔漣醒來中…</span>
  </div>
  <canvas id="live2d-canvas"></canvas>
  <div id="opener-bubble" role="status" aria-live="polite" hidden></div>
  <form id="pet-chat-form" aria-label="和昔漣快速對話" hidden>
    <input id="pet-chat-input" type="text" maxlength="500" autocomplete="off" placeholder="和昔漣說話…" aria-label="輸入訊息" />
    <button id="pet-chat-submit" type="submit" aria-label="送出訊息">↑</button>
  </form>
  <script type="module" src="./main.ts"></script>
</body>
</html>
