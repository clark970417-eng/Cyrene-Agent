<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15182a" />
  <meta
    name="description"
    content="A rope-based cooperative Discord Activity designed and developed by Clark."
  />
  <meta name="author" content="Clark" />
  <title>Cyrene Ropebound | Discord Activity by Clark</title>
  <script type="module" crossorigin src="./assets/index-ZfufOjk8.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B6mYI0fP.css">
</head>
<body>
  <main class="activity-shell">
    <iframe id="game-frame" title="Cyrene Ropebound" allow="autoplay; fullscreen"></iframe>
    <section id="room-lobby" class="room-lobby" aria-labelledby="room-title">
      <div class="room-card">
        <header>
          <p>CYRENE VOICE LINK · MEMORY KNOT ROOM</p>
          <span id="room-connection">Connecting to this Activity session</span>
        </header>
        <div class="room-rope" aria-hidden="true"><i></i><b></b><i></i></div>
        <h1 id="room-title">Who will join your journey?</h1>
        <p id="room-copy">Someone in your voice channel can take Player 2. If nobody joins, Cyrene will accompany you.</p>
        <div id="room-people" class="room-people" aria-live="polite"></div>
        <div id="room-actions" class="room-actions">
          <button id="room-primary" type="button">Prepare room</button>
          <button id="room-solo" type="button">Play solo</button>
        </div>
        <small id="room-note">Joining or leaving will not affect anyone else's solo progress.</small>
      </div>
    </section>
    <aside id="room-chip" class="room-chip" hidden aria-live="polite"></aside>
    <p id="activity-status" class="sr-only" aria-live="polite">Preparing the game</p>
  </main>
</body>
</html>
