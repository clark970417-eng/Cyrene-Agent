appId: com.cyrene.desktop
productName: 昔漣桌寵
executableName: Agent
directories:
  output: release
asar: true
electronDist: node_modules/electron/dist
files:
  - dist/**/*
  - package.json
  - prompts/**/*
  - assets/**/*
  - mobile/**/*
  - skills/**/*
  - game-recipes/**/*
  - vendor/**/*
  - models/**/*
extraResources:
  - from: resources/bin/cyrene-screenshot.exe
    to: bin/cyrene-screenshot.exe
mac:
  icon: assets/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  extendInfo:
    NSMicrophoneUsageDescription: 昔漣需要使用麥克風才能進行通話與語音辨識（ASR）。
    NSCameraUsageDescription: 昔漣需要使用攝影機才能在通話中分享畫面。
win:
  target:
    - dir
